name: "Continuous Integration"
on:
    push:
        branches: ["main"]
    pull_request:
    merge_group:
        types:
            - "checks_requested"
permissions:
    contents: "read"
concurrency:
    group: "ci-${{ github.ref }}"
    cancel-in-progress: true
jobs:
    test:
        name: "Test (${{ matrix.os }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 45
        permissions:
            contents: "read"
            id-token: "write"
        strategy:
            fail-fast: true
            matrix:
                os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        defaults:
            run:
                shell: "bash"
        steps:
            - name: "Harden runner"
              if: "runner.os == 'Linux'"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"
            - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              name: "Run actions/checkout"
            - uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false
              name: "Run actions/setup-node"
            - name: "Install the declared npm before restoring its cache"
              run: "npm install --global --ignore-scripts npm@12.0.2"
              working-directory: "${{ runner.temp }}"
              shell: "bash"
              timeout-minutes: 10
            - name: "Restore npm cache with npm 12"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  cache: "npm"
            - name: "Install declared npm and dependencies"
              run: |
                  npm ci
              shell: "bash"
              timeout-minutes: 40
            - run: "npm run build && npm run typecheck"
              name: "Run npm run build && npm run typecheck"
              shell: "bash"
              timeout-minutes: 40
            - run: "npm run test:coverage:ci"
              name: "Run npm run test:coverage:ci"
              shell: "bash"
              timeout-minutes: 40
            - name: "Upload coverage"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  files: "coverage/lcov.info"
                  flags: "${{ runner.os }}"
                  fail_ci_if_error: true
                  disable_search: true
            - name: "Upload test results"
              if: "!cancelled()"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  files: "test-report.junit.xml"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
    verify:
        name: "Quality, docs, and package compatibility"
        runs-on: "ubuntu-latest"
        timeout-minutes: 60
        steps:
            - uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"
              name: "Run step-security/harden-runner"
            - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  fetch-depth: 0
              name: "Run actions/checkout"
            - uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false
              name: "Run actions/setup-node"
            - name: "Install the declared npm before restoring its cache"
              run: "npm install --global --ignore-scripts npm@12.0.2"
              working-directory: "${{ runner.temp }}"
              shell: "bash"
              timeout-minutes: 10
            - name: "Restore npm cache with npm 12"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  cache: "npm"
            - name: "Install tooling"
              run: |
                  npm ci
                  go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
              shell: "bash"
              timeout-minutes: 40
            - run: "npm run release:verify"
              name: "Run npm run release:verify"
              shell: "bash"
              timeout-minutes: 40
            - run: "npm run test:compat:minimum"
              name: "Run npm run test:compat -- --minimum-node"
              shell: "bash"
              timeout-minutes: 40
            - name: "Analyze with Sonar and wait for its quality gate"
              if: "github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository"
              uses: "SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f" # v8.2.1
              env:
                  SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}"
run-name: "Continuous Integration • ${{ github.ref_name }}"
