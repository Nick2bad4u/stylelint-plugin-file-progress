name: "Deploy Docusaurus to GitHub Pages"
on:
    push:
        branches: ["main"]
    workflow_dispatch:
permissions:
    contents: "read"
concurrency:
    group: "pages"
    # Finish validated production deployments before starting the next one.
    cancel-in-progress: "${{ false }}"
jobs:
    build:
        name: "Build"
        permissions:
            contents: "read"
            pages: "read"
        runs-on: "ubuntu-latest"
        timeout-minutes: 40
        steps:
            - uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"
              name: "Run step-security/harden-runner"
            - uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0" # v7.0.0
              with:
                  fetch-depth: 0
              name: "Run actions/checkout"
            - uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  package-manager-cache: false
              name: "Run actions/setup-node"
            - name: "Install the declared npm before restoring its cache"
              run: "npm install --global --ignore-scripts npm@12.0.2"
              working-directory: "${{ runner.temp }}"
              shell: "bash"
              timeout-minutes: 10
            - name: "Restore npm cache with npm 12"
              uses: "actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0
              with:
                  node-version-file: ".node-version"
                  cache: "npm"
            - run: "npm ci"
              name: "Install locked dependencies"
              shell: "bash"
              timeout-minutes: 40
            - run: "npm run docs:build && npm run docs:check-links"
              name: "Run npm run docs:build && npm run docs:check-links"
              shell: "bash"
              timeout-minutes: 40
            - uses: "actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d" # v6.0.0
              name: "Run actions/configure-pages"
            - uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5.0.0
              with:
                  path: "docs/docusaurus/build"
              name: "Run actions/upload-pages-artifact"
    deploy:
        name: "Deploy"
        runs-on: "ubuntu-latest"
        needs: "build"
        permissions:
            pages: "write"
            id-token: "write"
        environment:
            name: "github-pages"
            url: "${{ steps.deployment.outputs.page_url }}"
        steps:
            - uses: "actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128" # v5.0.0
              id: "deployment"
              name: "Run actions/deploy-pages"
        timeout-minutes: 60
run-name: "Deploy Docusaurus to GitHub Pages • ${{ github.ref_name }}"
