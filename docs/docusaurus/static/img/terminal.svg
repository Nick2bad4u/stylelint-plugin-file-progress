<svg
    xmlns="http://www.w3.org/2000/svg"
    width="940"
    height="540"
    viewBox="0 0 940 540"
    role="img"
    aria-label="Two moments from a Stylelint run: live progress and the final process summary"
>
    <rect width="940" height="540" rx="14" fill="#0d1117" />
    <circle cx="28" cy="25" r="6" fill="#ff7b72" />
    <circle cx="48" cy="25" r="6" fill="#e3b341" />
    <circle cx="68" cy="25" r="6" fill="#7ee787" />
    <g font-family="Consolas,monospace" font-size="16">
        <text x="26.0" y="70" fill="#a5d6ff" font-weight="700" opacity="1">
            Stylelint File Progress
        </text>
        <text x="266.0" y="70" fill="#e6edf3" font-weight="400" opacity="1">
            / recommended-detailed
        </text>
        <text x="26.0" y="93" fill="#8b949e" font-weight="400" opacity="1">
            stderr | interactive terminal
        </text>
        <text x="26.0" y="139" fill="#a5d6ff" font-weight="400" opacity="1">
            $
        </text>
        <text x="45.2" y="139" fill="#e6edf3" font-weight="400" opacity="1">
            npx stylelint 'src/**/*.css'
        </text>
        <text x="26.0" y="185" fill="#a5d6ff" font-weight="400" opacity="1">
            ⠴
        </text>
        <text x="45.2" y="185" fill="#a5d6ff" font-weight="700" opacity="1">
            SFP
        </text>
        <text x="83.6" y="185" fill="#e6edf3" font-weight="400" opacity="0.6">
            •
        </text>
        <text x="102.8" y="185" fill="#e6edf3" font-weight="400" opacity="0.6">
            linting
        </text>
        <text x="179.6" y="185" fill="#79c0ff" font-weight="700" opacity="1">
            src
        </text>
        <text x="208.4" y="185" fill="#e6edf3" font-weight="400" opacity="0.6">
            /
        </text>
        <text x="218.0" y="185" fill="#7ee787" font-weight="700" opacity="1">
            utilities
        </text>
        <text x="304.4" y="185" fill="#7ee787" font-weight="400" opacity="1">
            .css
        </text>
        <path d="M26 279H914" stroke="#30363d" />
        <text x="26" y="308" fill="#8b949e">After process exit</text>
        <text x="26.0" y="353" fill="#7ee787" font-weight="400" opacity="1">
            •
        </text>
        <text x="45.2" y="353" fill="#a5d6ff" font-weight="700" opacity="1">
            SFP
        </text>
        <text x="74.0" y="353" fill="#e6edf3" font-weight="400" opacity="0.6">
            :
        </text>
        <text x="93.2" y="353" fill="#7ee787" font-weight="700" opacity="1">
            ✔
        </text>
        <text x="112.4" y="353" fill="#7ee787" font-weight="400" opacity="1">
            Lint complete.
        </text>
        <text x="45.2" y="376" fill="#e6edf3" font-weight="400" opacity="0.6">
            Elapsed since first file:
        </text>
        <text x="294.8" y="376" fill="#e3b341" font-weight="400" opacity="1">
            2.60s
        </text>
        <text x="45.2" y="399" fill="#e6edf3" font-weight="400" opacity="0.6">
            Files observed:
        </text>
        <text x="198.8" y="399" fill="#e3b341" font-weight="400" opacity="1">
            6
        </text>
        <text x="45.2" y="422" fill="#e6edf3" font-weight="400" opacity="0.6">
            Observed throughput:
        </text>
        <text x="246.8" y="422" fill="#e3b341" font-weight="400" opacity="1">
            2.31 files/s
        </text>
        <text x="45.2" y="445" fill="#e6edf3" font-weight="400" opacity="0.6">
            Process exit code:
        </text>
        <text x="227.6" y="445" fill="#7ee787" font-weight="400" opacity="1">
            0
        </text>
    </g>
</svg>
